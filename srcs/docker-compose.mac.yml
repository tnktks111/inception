services:
  mariadb:
    image: mariadb:bookworm
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    volumes:
      - type: volume
        source: db-vol
        target: /var/lib/mysql
    networks:
      - backend
    secrets:
      - db-password
      - db-root-password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --socket=/run/mysqld/mysqld.sock -uroot --password=\"$$(cat /run/secrets/db-root-password)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  wordpress:
    image: wordpress:bookworm
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp-admin-password
      WP_PASSWORD_FILE: /run/secrets/wp-user-password
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    networks:
      - frontend
      - backend
    secrets:
      - db-password
      - wp-admin-password
      - wp-user-password
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'test -f /var/www/html/wp-config.php && exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:bookworm
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    ports:
      - "443:443"
    networks:
      - frontend
    secrets:
      - nginx-server-crt
      - nginx-server-key

  adminer:
    image: adminer:bookworm
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend

  static_website:
    image: static_website:bookworm
    build:
      context: ./requirements/bonus/static_website
      dockerfile: Dockerfile
    restart: always
    networks:
      - frontend

  redis:
    image: redis:bookworm
    build:
      context: ./requirements/bonus/redis/
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend

  ftp:
    image: ftp:bookworm
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      FTP_PASSWORD_FILE: /run/secrets/ftp-password
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - ftp-network
    secrets:
      - ftp-password

  homer:
    image: homer:bookworm
    build:
      context: ./requirements/bonus/homer
      dockerfile: Dockerfile
    restart: always
    networks:
      - frontend

volumes:
  db-vol:
    name: inception_db-vol-mac
  wp-vol:
    name: inception_wp-vol-mac

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  ftp-network:
    driver: bridge

secrets:
  db-password:
    file: ../secrets/db_password.txt
  db-root-password:
    file: ../secrets/db_root_password.txt
  wp-admin-password:
    file: ../secrets/wp_admin_password.txt
  wp-user-password:
    file: ../secrets/wp_user_password.txt
  nginx-server-crt:
    file: ../secrets/nginx/server.crt
  nginx-server-key:
    file: ../secrets/nginx/server.key
  ftp-password:
    file: ../secrets/ftp_password.txt

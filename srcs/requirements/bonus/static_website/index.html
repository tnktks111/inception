<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception | Bonus Site</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px; /* 角を丸く */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* ほのかな影 */
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #7f8c8d;
            font-size: 1.2rem;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .info-box {
            background-color: #e3f2fd; /* 薄いブルーの背景 */
            border-left: 5px solid #2196f3; /* 左側の青い線 */
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
            text-align: left;
        }

        .badge {
            background-color: #2ecc71; /* 緑色 */
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ttanaka</h1>
        <h2>42 Tokyo | Student Portfolio</h2>

        <div class="info-box">
            <strong>✅ Project: Inception</strong><br>
            このページはボーナスパート（静的Webサイト）のために作られました。
            PHPを使わず、Pythonの組み込みWebサーバーで配信されています。
        </div>

        <p>
            <span class="badge">Bonus #1: Adminer</span>
            <span class="badge">Bonus #2: Static Site</span>
        </p>

        <a href="https://ttanaka.42.fr" class="back-button">← Back to WordPress</a>
    </div>
</body>
</html>

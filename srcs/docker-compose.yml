services:
  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    volumes:
      - type: volume
        source: db-vol
        target: /var/lib/mysql
    networks:
      docker-network:
        ipv4_address: 172.20.0.4
    secrets:
      - db-password
      - db-root-password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --socket=/run/mysqld/mysqld.sock -uroot --password=\"$$(cat /run/secrets/db-root-password)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp-admin-password
      WP_PASSWORD_FILE: /run/secrets/wp-user-password
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    networks:
      docker-network:
        ipv4_address: 172.20.0.3
    secrets:
      - db-password
      - wp-admin-password
      - wp-user-password
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'test -f /var/www/html/wp-config.php && exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    ports:
      - "443:443"
    networks:
      docker-network:
        ipv4_address: 172.20.0.2
    secrets:
      - nginx-server-crt
      - nginx-server-key

  adminer:
    image: adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      docker-network:
        ipv4_address: 172.20.0.5

  static_website:
    image: static_website
    build:
      context: ./requirements/bonus/static_website
      dockerfile: Dockerfile
    restart: always
    networks:
      docker-network:
        ipv4_address: 172.20.0.6

  redis:
    image: redis
    build:
      context: ./requirements/bonus/redis/
      dockerfile: Dockerfile
    restart: always
    networks:
      docker-network:
        ipv4_address: 172.20.0.7

  ftp:
    image: ftp
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      FTP_PASSWORD_FILE: /run/secrets/ftp-password
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - type: volume
        source: wp-vol
        target: /var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      docker-network:
        ipv4_address: 172.20.0.8
    secrets:
      - ftp-password

  homer:
    image: homer
    build:
      context: ./requirements/bonus/homer
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8888:80"
    networks:
      docker-network:
        ipv4_address: 172.20.0.9

volumes:
  db-vol:
    name: inception-db
  wp-vol:
    name: inception-wp

networks:
  docker-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

secrets:
  db-password:
    file: ../secrets/db_password.txt
  db-root-password:
    file: ../secrets/db_root_password.txt
  wp-admin-password:
    file: ../secrets/wp_admin_password.txt
  wp-user-password:
    file: ../secrets/wp_user_password.txt
  nginx-server-crt:
    file: ../secrets/nginx/server.crt
  nginx-server-key:
    file: ../secrets/nginx/server.key
  ftp-password:
    file: ../secrets/ftp_password.txt